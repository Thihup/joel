name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build and sign without publishing to Maven Central)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4

      - name: Set up JDK & GPG
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          server-id: central
          server-username-env-var: SONATYPE_USERNAME
          server-password-env-var: SONATYPE_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Run Tests
        run: mvn --no-transfer-progress verify -Ptck

      - name: Build & Sign (Dry Run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: mvn --no-transfer-progress --batch-mode verify -P release

      - name: Deploy to Maven Central Portal
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: mvn --no-transfer-progress --batch-mode deploy -P release -DskipTests

      - name: Publish GitHub Release & Upload JARs
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            VERSION="${TAG_NAME#v}"
          else
            VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null || echo "6.1.0-M2")
            TAG_NAME="v${VERSION}"
          fi

          FILES=(jakarta.el/target/*.jar dev.thihup.joel/target/*.jar)
          echo "Uploading assets to release ${TAG_NAME}: ${FILES[*]}"

          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" "${FILES[@]}" --title "JoEL ${VERSION}" --generate-notes
          else
            gh release upload "$TAG_NAME" "${FILES[@]}" --clobber
          fi

